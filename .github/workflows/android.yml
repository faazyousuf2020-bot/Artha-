name: Build Artha APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install
        run: npm ci

      - name: Copy web app into Android project
        run: npx cap sync android

      - name: Build signed APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "Artha-v1.1.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Artha-APK
          path: Artha-*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: Artha v1.1.${{ github.run_number }}
          body: |
            Download **Artha-v1.1.${{ github.run_number }}.apk** below and open it on your Android phone.
            Updates install over the previous version and keep your data.
          files: Artha-*.apk
          make_latest: true
